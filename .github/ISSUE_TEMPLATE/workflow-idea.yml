name: Workflow or agent idea
description: Suggest a new workflow recipe or agent definition
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The workflow
      description: What task is it for, which models does each agent use, and why?
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: What happened when you tried it? Cost, speed, or quality notes help.
