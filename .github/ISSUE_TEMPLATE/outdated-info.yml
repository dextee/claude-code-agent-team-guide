name: Outdated information
description: A model, price, alias, or feature in the guide has changed
labels: ["outdated"]
body:
  - type: input
    id: section
    attributes:
      label: Section
      description: Which section or file is out of date?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed
      description: What does the guide say, and what is correct now?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source
      description: Link to the Claude Code or Claude API docs page that confirms it
    validations:
      required: true
