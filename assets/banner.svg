<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Claude Code Model Guide 2026</title>
  <desc id="d">Agent team playbook: Fable 5.1 plans and audits, Opus 5 builds, Sonnet 5 works in parallel, Haiku 4.5 explores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110f"/>
      <stop offset="1" stop-color="#2a1c14"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#e8835a" font-size="20" font-weight="600" letter-spacing="3">OPEN PLAYBOOK · 2026</text>
    <text x="64" y="156" fill="#faf7f2" font-size="56" font-weight="700">Claude Code Model Guide</text>
    <text x="64" y="200" fill="#c9bfb4" font-size="24">Which model should each agent on your team run?</text>

    <!-- team roles -->
    <g font-size="18">
      <g transform="translate(64,250)">
        <rect width="264" height="96" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#e8835a" stroke-opacity="0.6"/>
        <text x="20" y="38" fill="#faf7f2" font-weight="700" font-size="22">Fable 5.1</text>
        <text x="20" y="70" fill="#c9bfb4">Plan · Advise · Audit</text>
      </g>
      <g transform="translate(348,250)">
        <rect width="264" height="96" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="20" y="38" fill="#faf7f2" font-weight="700" font-size="22">Opus 5</text>
        <text x="20" y="70" fill="#c9bfb4">Lead · Build</text>
      </g>
      <g transform="translate(632,250)">
        <rect width="264" height="96" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="20" y="38" fill="#faf7f2" font-weight="700" font-size="22">Sonnet 5</text>
        <text x="20" y="70" fill="#c9bfb4">Parallel workers · Tests</text>
      </g>
      <g transform="translate(916,250)">
        <rect width="300" height="96" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="20" y="38" fill="#faf7f2" font-weight="700" font-size="22">Haiku 4.5</text>
        <text x="20" y="70" fill="#c9bfb4">Explore · Search</text>
      </g>
    </g>
    <text x="1216" y="92" fill="#8a7f75" font-size="16" text-anchor="end">github.com/dextee</text>
  </g>
</svg>
