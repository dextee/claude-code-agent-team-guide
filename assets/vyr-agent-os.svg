<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">VYR Agent OS: give repetitive work a better path</title>
  <desc id="desc">A business enquiry moves through specialist agents, human approval and a verified outcome. Explore fourteen workflow examples with VYR.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c20"/><stop offset="1" stop-color="#223f43"/></linearGradient></defs>
  <rect width="1600" height="620" rx="24" fill="url(#bg)"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="78" y="93" fill="#a2d0bd" font-size="25" letter-spacing="5">VYR / AGENT OS</text>
    <text x="78" y="184" fill="#fffaf0" font-size="63" font-weight="700">Give repetitive work</text>
    <text x="78" y="259" fill="#fffaf0" font-size="63" font-weight="700">a better path.</text>
    <text x="80" y="321" fill="#cfddd8" font-size="27">14 business workflows. Your team stays in control.</text>
    <g transform="translate(78 386)">
      <rect width="300" height="118" rx="14" fill="#2b484b" stroke="#527675"/>
      <text x="26" y="38" font-size="16" fill="#a2d0bd" letter-spacing="2">01 / THE TRIGGER</text>
      <text x="26" y="79" font-size="28" fill="#fffaf0">A task arrives</text>
      <path d="M319 57h40m-11-10 11 10-11 10" fill="none" stroke="#c7aa70" stroke-width="3"/>
      <rect x="380" width="300" height="118" rx="14" fill="#2b484b" stroke="#527675"/>
      <text x="406" y="38" font-size="16" fill="#a2d0bd" letter-spacing="2">02 / SPECIALISTS</text>
      <text x="406" y="79" font-size="28" fill="#fffaf0">Agents prepare</text>
      <path d="M699 57h40m-11-10 11 10-11 10" fill="none" stroke="#c7aa70" stroke-width="3"/>
      <rect x="760" width="300" height="118" rx="14" fill="#c7aa70"/>
      <text x="786" y="38" font-size="16" fill="#253331" letter-spacing="2">03 / YOUR DECISION</text>
      <text x="786" y="79" font-size="28" fill="#16272b">People approve</text>
      <path d="M1079 57h40m-11-10 11 10-11 10" fill="none" stroke="#c7aa70" stroke-width="3"/>
      <rect x="1140" width="300" height="118" rx="14" fill="#a2d0bd"/>
      <text x="1166" y="38" font-size="16" fill="#253331" letter-spacing="2">04 / THE RESULT</text>
      <text x="1166" y="79" font-size="28" fill="#16272b">Work moves forward</text>
    </g>
    <text x="80" y="563" fill="#cfddd8" font-size="20">Explore the workflow. Discuss the fit. Agree the scope.</text>
    <text x="1520" y="563" text-anchor="end" fill="#a2d0bd" font-size="24">vyrwork.com</text>
  </g>
</svg>
